apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app-2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/venkatasai987/argo-app.git'
    targetRevision: main
    path: k8s-2
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nginx-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
