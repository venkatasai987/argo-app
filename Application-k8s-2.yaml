apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app-2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/venkatasai987/argo-app.git'
    targetRevision: main
    path: k8s-2
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nginx-demo
  syncPolicy:
    automated:
      prune: true     # Automatically deletes resources in k8s that were removed from Git  (Ensures resources deleted from your Git repository are also removed from Kubernetes so no "orphaned" manual configs linger.     
      selfHeal: true  # Automatically reverts manual kubectl edits/deletes back to Git state
    syncOptions:
      - CreateNamespace=true
      - Delete=false   # <-- Prevents Argo CD from deleting any resources of this app
